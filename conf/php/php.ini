; =============================================================================
; PHP Production configuration for Laravel
; Overrides applied on top of Debian/Sury defaults
; =============================================================================

[PHP]
; Security: hide PHP version and disable error display
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /home/container/logs/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Resource limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 5000

; Upload limits (match Nginx client_max_body_size)
upload_max_filesize = 100M
post_max_size = 100M
file_uploads = On

; Session configuration
session.save_handler = files
session.save_path = /home/container/tmp/sessions

; Timezone (can be overridden by Laravel config)
date.timezone = UTC

; Path restrictions
open_basedir = /home/container:/tmp:/usr/share/php

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; Realpath cache (improves autoloader performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
; OPcache enabled for production performance
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Production: do not check file timestamps (artisan optimize handles this)
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit_buffer_size = 64M
