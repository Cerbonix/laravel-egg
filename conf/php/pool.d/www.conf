; =============================================================================
; PHP-FPM pool — "www"
; Unix socket for low-latency Nginx ↔ PHP-FPM communication
; =============================================================================

[www]
user = container
group = container

; Unix socket (faster than TCP for same-host)
listen = /home/container/tmp/php-fpm.sock
listen.owner = container
listen.group = container
listen.mode = 0660

; Process management — dynamic scaling
; pm.max_children is auto-tuned by start.sh based on SERVER_MEMORY
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Pass Pterodactyl environment variables to PHP workers
clear_env = no

; Timeout for long-running requests (migrations, imports)
request_terminate_timeout = 300s

; Slow log for debugging performance issues
slowlog = /home/container/logs/php-fpm-slow.log
request_slowlog_timeout = 10s

; Status page (accessible only from localhost)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
