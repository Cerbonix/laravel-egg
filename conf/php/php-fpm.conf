; =============================================================================
; PHP-FPM global configuration
; Runs daemonized — Nginx stays in foreground as PID 1 supervisor
; =============================================================================

[global]
; PID file in user-writable path
pid = /home/container/tmp/php-fpm.pid

; Error logging
error_log = /home/container/logs/php-fpm-error.log
log_level = warning

; Daemonize so Nginx can be the foreground process
daemonize = yes

; Include pool configs
include = /home/container/conf/php/pool.d/*.conf
