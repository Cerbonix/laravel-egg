# =============================================================================
# Nginx main config — runs as non-root user "container"
# All temp/pid paths point to user-writable directory
# =============================================================================

# Foreground mode (required for container process management)
daemon off;

worker_processes auto;
worker_rlimit_nofile 2048;

# PID file in user-writable path
pid /home/container/tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security: hide Nginx version
    server_tokens off;

    # Temp paths writable by container user
    client_body_temp_path /home/container/tmp/nginx/client_body;
    proxy_temp_path       /home/container/tmp/nginx/proxy;
    fastcgi_temp_path     /home/container/tmp/nginx/fastcgi;
    uwsgi_temp_path       /home/container/tmp/nginx/uwsgi;
    scgi_temp_path        /home/container/tmp/nginx/scgi;

    # Logging
    access_log /home/container/logs/nginx-access.log;
    error_log  /home/container/logs/nginx-error.log warn;

    # Performance
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Include virtual hosts
    include /home/container/conf/nginx/conf.d/*.conf;
}
