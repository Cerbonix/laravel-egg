# =============================================================================
# Laravel vhost — Pterodactyl dynamic port allocation
# PHP-FPM communicates via Unix socket for lower overhead
# =============================================================================

server {
    listen {{SERVER_PORT}};
    server_name _;

    root /home/container/www/public;
    index index.php index.html;

    charset utf-8;

    # Laravel front controller pattern
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM via Unix socket
    location ~ \.php$ {
        fastcgi_pass unix:/home/container/tmp/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
    }

    # Static asset caching (30 days)
    location ~* \.(css|js|ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block dotfiles (except .well-known for ACME challenges)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive Laravel files
    location ~ /(\.env|composer\.json|composer\.lock|package\.json|package-lock\.json|webpack\.mix\.js|artisan) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to storage and vendor directories
    location ~ ^/(storage|vendor)/ {
        deny all;
    }

    # Favicon and robots: suppress logging
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Custom error page
    error_page 404 /index.php;
}
